<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9B2335">
<meta name="description" content="YarnLoop · by @lenmomam — Nhật ký đan & móc len / Your knit & crochet journal">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YarnLoop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>YarnLoop · by @lenmomam</title>
<style>
:root{--p:#9B2335;--pl:#C4687A;--pd:#7A1A28;--bg:#FDF6F7;--card:#FFFFFF;--soft:#FFF0F2;--bd:#E8C5CB;--bdl:#F2D8DC;--tx:#2D1B1E;--tx2:#7A4A52;--mu:#A67880;--ok:#6B9E78;--warn:#C4956A;--err:#B85C5C;--r:13px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--p)}
h1,h2,h3,h4{margin:0 0 .45em;line-height:1.25}
h2{font-size:17px}h3{font-size:15px}
p{margin:.3em 0}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.nojs{max-width:460px;margin:15vh auto;padding:26px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);text-align:center;box-shadow:0 8px 30px rgba(155,35,53,.08)}
.nojs b{color:var(--p);font-size:18px}
/* ---------- layout ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:232px;background:#fff;border-right:1px solid var(--bdl);display:flex;flex-direction:column;padding:calc(14px + var(--sat)) 12px calc(12px + var(--sab)) calc(12px + var(--sal));overflow-y:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 8px;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand b{font-size:17px;display:block;line-height:1.15}
.brand small{color:var(--mu);font-size:11.5px;display:block}
.langsw{display:flex;gap:4px;margin:4px 6px 0;background:var(--soft);border-radius:9px;padding:3px}
.langsw button{flex:1;border:0;background:transparent;border-radius:7px;padding:4px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.langsw button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.navgrp{margin-top:12px}
.navgrp>div{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);padding:4px 10px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--tx2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--p);font-weight:650}
.nav a span{width:20px;text-align:center}
.grow{flex:1}
.tk{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px;border-radius:var(--r);background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--bdl);text-decoration:none;color:var(--tx)}
.tk .tki{width:34px;height:34px;border-radius:50%;background:var(--tx);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.tk small{display:block;color:var(--mu);font-size:11.5px}
.setcard{margin-top:10px;padding:10px;border:1px solid var(--bdl);border-radius:var(--r);background:var(--bg);text-align:left;width:100%;display:block}
.setcard:hover{border-color:var(--bd)}
.setcard small{display:block;color:var(--mu);font-size:11.5px}
.main{margin-left:232px;min-height:100vh}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) calc(20px + var(--sar)) 10px 20px;background:rgba(253,246,247,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--bdl)}
.top h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:260px;max-width:36vw}
.mob{display:none!important}
#view{padding:20px;max-width:1140px}
.bnav{display:none}
@media (max-width:820px){
  .side{display:none}
  .main{margin-left:0}
  .mob{display:inline-flex!important}
  .desk{display:none!important}
  .top{padding:calc(8px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal))}
  .top h1{font-size:17px}
  #view{padding:14px calc(12px + var(--sar)) calc(96px + var(--sab)) calc(12px + var(--sal))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--bdl);padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);text-decoration:none;padding:3px 0;font-weight:500}
  .bnav a span{font-size:20px;line-height:1.1}
  .bnav a.on{color:var(--p);font-weight:700}
  input,select,textarea{font-size:16px!important}
  .ov{align-items:flex-end!important;padding:0!important}
  .sheet{width:100%!important;max-width:none!important;border-radius:18px 18px 0 0!important;max-height:92vh!important;padding-bottom:calc(18px + var(--sab))!important;animation:up .22s ease}
  #toast,#undo{bottom:calc(84px + var(--sab))!important}
  #undo{bottom:calc(84px + var(--sab))!important}
}
@keyframes up{from{transform:translateY(50px);opacity:.3}to{transform:none;opacity:1}}
/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--bdl);border-radius:var(--r);padding:16px;min-width:0}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.g2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx2);font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px;line-height:1.2}
.btn:hover{border-color:var(--pl);color:var(--p)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.p:hover{background:var(--pd);border-color:var(--pd);color:#fff}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--tx2);min-width:34px;min-height:34px}
.ib:hover{background:var(--soft);color:var(--p)}
.linkbtn{border:0;background:none;padding:2px;text-decoration:underline;color:inherit;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--tx2);border:1px solid var(--bdl);white-space:nowrap}
.st-idea{background:#FFF6E9;color:#94642B;border-color:#F0DCBC}
.st-wip{background:#FBE7EA;color:var(--p);border-color:#F0C3CB}
.st-paused{background:#F2EEF0;color:#6E5D62;border-color:#E2DADD}
.st-done{background:#EAF3EC;color:#4D7B59;border-color:#CBE2D1}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;background:var(--soft);color:var(--tx2);border:1px solid var(--bdl);white-space:nowrap}
.tag.dk{background:var(--p);color:#fff;border-color:var(--p)}
.mut{color:var(--mu)}.sub{color:var(--tx2)}.small{font-size:12.5px}.b{font-weight:650}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--err)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>span{font-size:12.5px;color:var(--tx2);font-weight:600}
.inp{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;outline:none;min-height:40px}
.inp:focus{border-color:var(--pl);box-shadow:0 0 0 3px rgba(196,104,122,.18)}
textarea.inp{min-height:86px;resize:vertical;line-height:1.45}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
@media (max-width:520px){.f3{grid-template-columns:1fr 1fr}}
.errm{color:var(--err);font-size:13px;min-height:1.2em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--tx2);font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip.off{opacity:.5;text-decoration:line-through}
.bar{height:7px;border-radius:9px;background:var(--bdl);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pl),var(--p));border-radius:9px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .e-ic{font-size:36px}
.alert{border-radius:var(--r);padding:12px 14px;border:1px solid}
.alert.red{background:#FBEDED;border-color:#E9BDBD;color:#8C3434}
.alert.amber{background:#FFF6EC;border-color:#EFD7BB;color:#7D5524}
.alert.soft{background:var(--soft);border-color:var(--bdl);color:var(--tx2)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--bdl);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mu);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.kv td:first-child{color:var(--tx2);width:42%}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
details>summary{cursor:pointer;font-weight:600;color:var(--tx2)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2,.sec-h h3{margin:0}
.hr{height:1px;background:var(--bdl);margin:12px 0}
/* stats & resume */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--bdl);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit;display:block}
.stat b{font-size:24px;display:block;color:var(--p);line-height:1.2}
.stat small{color:var(--mu)}
.resume{background:linear-gradient(135deg,var(--pd),var(--p) 50%,var(--pl));color:#fff;border-radius:var(--r);padding:18px;box-shadow:0 10px 26px rgba(155,35,53,.22)}
.resume .r-k{opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.resume h2{font-size:20px;margin:2px 0 8px}
.resume .r-nums{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.resume .r-nums b{font-size:22px;display:block}
.resume .r-next{background:rgba(255,255,255,.95);color:var(--tx);border-radius:11px;padding:10px 12px;margin:10px 0}
.resume .bar{background:rgba(255,255,255,.3)}.resume .bar>i{background:#fff}
.btn.white{background:#fff;color:var(--p);border-color:#fff}
.act li{list-style:none;padding:7px 0;border-bottom:1px solid var(--bdl);display:flex;gap:10px}
.act{margin:0;padding:0}.act li:last-child{border-bottom:0}
/* project cards */
.pcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(155,35,53,.1)}
.pimg{width:100%;height:150px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ptop b{font-size:15px}
.meta{font-size:12.5px;color:var(--tx2);display:flex;gap:4px 10px;flex-wrap:wrap}
/* counter */
.counter{background:linear-gradient(150deg,var(--pd),var(--p) 55%,var(--pl));color:#fff;border-radius:var(--r);padding:18px 16px;text-align:center;box-shadow:0 10px 26px rgba(155,35,53,.22)}
.counter .c-k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.cnum{font-size:78px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0}
.c-sub{opacity:.9;font-size:13px}
.cbtns{display:flex;gap:18px;align-items:center;justify-content:center;margin:14px 0 8px}
.cbtn{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cbtn.big{width:100px;height:100px;font-size:46px;background:#fff;color:var(--p);border-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cbtn:active{transform:scale(.94)}
.counter .linkbtn{color:#fff;opacity:.85}
.cnow{background:rgba(255,255,255,.96);color:var(--tx);border-radius:11px;padding:12px;text-align:left;margin-top:12px}
.cnow h4{margin:0 0 6px;color:var(--p)}
.cnow .cn-i+.cn-i{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
/* row notes */
.rn{display:flex;gap:10px;padding:10px;border:1px solid var(--bdl);border-radius:11px;margin-top:8px;align-items:flex-start;background:#fff}
.rn.cur{border:2px solid var(--p);background:var(--soft)}
.rn.done .rn-t{opacity:.55}
.rn input[type=checkbox]{width:20px;height:20px;accent-color:var(--p);margin:2px 0 0}
.rn-b{flex:1;min-width:0}
.rn-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.rn-h b{font-size:14px;color:var(--pd)}
.rn-t{margin-top:4px;white-space:normal;word-break:break-word}
.rn-a{display:flex;flex-direction:column}
.posl{margin-top:6px;padding:6px 9px;border-radius:8px;background:#fff;border-left:3px solid var(--p);font-size:13px}
.posl b{color:var(--p)}
.fl{border:1px solid var(--bdl);border-radius:11px;padding:10px 12px;margin-top:8px}
.fl ol{margin:6px 0;padding-left:22px}
.fl li{margin:2px 0}
/* images */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.im{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--bdl);background:var(--soft)}
.im img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.im button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(45,27,30,.6);color:#fff;font-size:13px;line-height:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0!important}
/* yarn */
.ycard{display:flex;gap:12px;text-decoration:none;color:inherit;align-items:flex-start}
.ycard:hover{border-color:var(--bd)}
.ysw{width:46px;height:46px;border-radius:12px;flex:none;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 -6px 10px rgba(0,0,0,.08)}
.ysw.lg{width:64px;height:64px;border-radius:16px}
.ynums{margin-top:4px;font-size:13px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.idea{border:1px solid var(--bdl);border-radius:11px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.idea img{width:100%;height:130px;object-fit:cover;cursor:zoom-in}
.idea .ib-b{padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.lib{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bdl)}
.lib:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--bdl);border-radius:12px;padding:4px;overflow-x:auto}
.tabs a{flex:1;text-align:center;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--tx2);font-weight:600;white-space:nowrap;font-size:13.5px}
.tabs a.on{background:var(--p);color:#fff}
/* modal */
.ov{position:fixed;inset:0;background:rgba(45,27,30,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(45,27,30,.25);-webkit-overflow-scrolling:touch}
.sheet.sm{max-width:410px}.sheet.lg{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.mh h2{margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.cfm{text-align:center}
.cfm .c-ic{font-size:40px}
.cfm p{color:var(--tx2)}
.cfm .acts{justify-content:center}
.menu a,.menu button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid var(--bdl);border-radius:12px;background:#fff;margin-bottom:8px;text-decoration:none;color:var(--tx);font-weight:600}
.menu a:hover,.menu button:hover{border-color:var(--pl);background:var(--soft)}
.menu small{display:block;font-weight:400;color:var(--mu)}
.menu .mi{font-size:22px;width:30px;text-align:center}
.lb{background:transparent!important;box-shadow:none!important;text-align:center;padding:0!important;max-width:96vw!important}
.lb img{max-width:100%;max-height:86vh;border-radius:10px;background:#fff}
/* toast & undo */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#undo{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--tx);color:#fff;padding:8px 8px 8px 16px;border-radius:12px;display:none;gap:12px;align-items:center;z-index:199;max-width:94vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#undo.show{display:flex}
#undo button{background:var(--pl);color:#fff;border:0;border-radius:9px;padding:7px 12px;font-weight:700;white-space:nowrap}
#undo i{display:block;height:3px;background:var(--pl);position:absolute;left:0;bottom:0;border-radius:3px;animation:shrink 10s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
/* welcome */
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 18px calc(24px + var(--sab));background:radial-gradient(circle at 20% 10%,#FBE3E8,transparent 50%),radial-gradient(circle at 90% 90%,#F6D3DA,transparent 45%),var(--bg)}
.wcard{max-width:450px;width:100%;background:#fff;border:1px solid var(--bdl);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 16px 40px rgba(155,35,53,.12)}
.wcard h1{font-size:28px;margin:12px 0 0;color:var(--p)}
.wcard .langsw{max-width:220px;margin:14px auto}
.wcard .btn{width:100%;margin-top:8px}
.guide{text-align:left;font-size:13px;color:var(--tx2)}
.guide li{margin:4px 0}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.st-prev{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:#fff;border:1px solid var(--bdl);border-radius:var(--r);padding:22px}
@media (max-width:1000px){.studio{grid-template-columns:minmax(0,1fr)}.st-prev{position:static;max-height:none;padding:16px}}
.secd{border:1px solid var(--bdl);border-radius:11px;padding:10px;margin-top:10px;background:var(--bg)}
.secd .row{margin-bottom:6px}
.secd .row .inp{flex:1;min-width:120px}
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* =====================================================================
   STORAGE  (IndexedDB key-value → localStorage → cảnh báo)
   ===================================================================== */
const LS_KEY = 'yarnloop-db';
const STORE = { mode: null, idb: null };
let db = null;

function openIDB() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window) || !window.indexedDB) return rej(new Error('no idb'));
    let r;
    try { r = indexedDB.open('yarnloop', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function idbGet(k) {
  return new Promise((res, rej) => {
    const q = STORE.idb.transaction('kv', 'readonly').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {
  return new Promise((res, rej) => {
    const tx = STORE.idb.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
function lsGet() { try { return localStorage.getItem(LS_KEY); } catch (e) { return null; } }
async function storeInit() {
  try { STORE.idb = await openIDB(); await idbSet('_probe', 1); STORE.mode = 'idb'; }
  catch (e) {
    try { localStorage.setItem('_yl_probe', '1'); localStorage.removeItem('_yl_probe'); STORE.mode = 'ls'; }
    catch (e2) { STORE.mode = null; }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
async function storeLoad() {
  let raw = null;
  try {
    if (STORE.mode === 'idb') raw = await idbGet('db');
    if (!raw) raw = lsGet();
    if (typeof raw === 'string') raw = JSON.parse(raw);
  } catch (e) { console.warn('load failed', e); raw = null; }
  return raw;
}
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(flush, 250); }
async function flush() {
  clearTimeout(saveT); saveT = null;
  if (!STORE.mode || !db) return;
  try {
    const s = JSON.stringify(db);
    if (STORE.mode === 'idb') await idbSet('db', s); else localStorage.setItem(LS_KEY, s);
  } catch (e) {
    console.warn('save failed', e);
    toast(t('⚠️ Không lưu được — bộ nhớ có thể đã đầy', '⚠️ Could not save — storage may be full'));
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', () => flush());

/* ---------- images: thu nhỏ bằng canvas, JPEG 0.75 ---------- */
function readImage(file, max) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('not image'));
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function readImages(files, max) {
  const out = [];
  for (const f of Array.from(files || [])) { try { out.push(await readImage(f, max)); } catch (e) { console.warn(e); } }
  return out;
}

let toastT = null;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}
function modal(html, opts) {
  opts = opts || {};
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${opts.cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
  let closed = false;
  ov._close = v => { if (closed) return; closed = true; ov.remove(); if (opts.onClose) opts.onClose(v); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov._down = true; });
  ov.addEventListener('click', e => { if (e.target === ov && ov._down) ov._close(); ov._down = false; });
  $('#modals').appendChild(ov);
  const f = ov.querySelector('[autofocus]'); if (f && matchMedia('(min-width:821px)').matches) setTimeout(() => f.focus(), 30);
  return ov;
}
function topModal() { const a = $$('#modals .ov'); return a[a.length - 1]; }
function closeAll() { $$('#modals .ov').forEach(o => o._close()); }

/* Hộp thoại xác nhận riêng (không dùng confirm()). word = phải gõ chữ này mới bấm được */
function ask(o) {
  return new Promise(res => {
    const ov = modal(`<div class="cfm"><div class="c-ic">${o.ic || '🗑'}</div><h2>${esc(o.title)}</h2>${o.desc ? `<p>${o.desc}</p>` : ''}
      ${o.word ? `<p class="small">${t('Gõ', 'Type')} <b>${o.word}</b> ${t('để xác nhận', 'to confirm')}</p><input class="inp" id="cfmWord" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-align:center">` : ''}
      <div class="acts"><button class="btn" type="button" data-x="no">${t('Huỷ', 'Cancel')}</button><button class="btn ${o.safe ? 'p' : 'danger'}" type="button" data-x="yes" ${o.word ? 'disabled' : ''}>${esc(o.ok || t('Xoá', 'Delete'))}</button></div></div>`,
      { cls: 'sm', onClose: v => res(v === true) });
    ov.querySelector('[data-x=no]').onclick = () => ov._close(false);
    const yes = ov.querySelector('[data-x=yes]');
    yes.onclick = () => { if (!yes.disabled) ov._close(true); };
    if (o.word) {
      const i = ov.querySelector('#cfmWord');
      i.oninput = () => { yes.disabled = i.value.trim().toUpperCase() !== o.word; };
      i.onkeydown = e => { if (e.key === 'Enter' && !yes.disabled) ov._close(true); };
      setTimeout(() => i.focus(), 50);
    } else setTimeout(() => yes.focus(), 30);
  });
}

function allLib() { return LIB.concat(db.customLib.map(x => Object.assign({ custom: true }, x))); }
const rng = a => (a && a.length ? (a[0] === a[1] || a[1] == null || a[1] === '' ? String(a[0]) : a[0] + '-' + a[1]) : '');
function libDist(item, g) { const lo = num(item.g[0]), hi = num(item.g[1]) || lo; return g < lo ? lo - g : g > hi ? g - hi : 0; }
function weightsFor(g) {
  let ws = WEIGHTS.filter(w => g >= w.g[0] && g <= w.g[1]);
  if (!ws.length) ws = WEIGHTS.slice().sort((a, b) => Math.min(Math.abs(a.g[0] - g), Math.abs(a.g[1] - g)) - Math.min(Math.abs(b.g[0] - g), Math.abs(b.g[1] - g))).slice(0, 1);
  return ws;
}

function roundMult(x, mult, edge) {
  mult = num(mult) || 0; edge = num(edge) || 0;
  if (mult > 1) { const k = Math.max(1, Math.round((x - edge) / mult)); return k * mult + edge; }
  return Math.round(x);
}
function gaugeResults() {
  const g = state.g;
  const pS = num(g.pS), pR = num(g.pR), mS = num(g.mS), mR = num(g.mR);
  let out = '';
  if (g.mode === 2) {
    const s = mS || pS, r = mR || pR;
    const ws = listNums(g.widths), ls = listNums(g.lengths);
    if (!s && !r) out = `<p class="mut">${t('Nhập gauge của bạn (hoặc gauge pattern) để tính.', 'Enter your gauge (or the pattern gauge) to calculate.')}</p>`;
    else {
      if (ws.length && s) out += `<h3>${t('Chiều rộng → Stitches', 'Width → Stitches')}</h3><div class="scrollx"><table class="tbl"><tr><th>${t('Rộng', 'Width')}</th><th class="num">Stitches</th></tr>${ws.map(w => `<tr><td>${fmt(w)} cm</td><td class="num b">${roundMult(w / 10 * s, g.mult, g.edge)} sts</td></tr>`).join('')}</table></div>`;
      if (ls.length && r) out += `<h3 style="margin-top:12px">${t('Chiều dài → Rows', 'Length → Rows')}</h3><div class="scrollx"><table class="tbl"><tr><th>${t('Dài', 'Length')}</th><th class="num">Rows</th></tr>${ls.map(l => `<tr><td>${fmt(l)} cm</td><td class="num b">${Math.round(l / 10 * r)} rows</td></tr>`).join('')}</table></div>`;
      if (!out) out = `<p class="mut">${t('Nhập chiều rộng / chiều dài (cm), cách nhau bằng dấu phẩy.', 'Enter widths / lengths (cm), separated by commas.')}</p>`;
      out = `<p class="small sub">${t('Tính theo gauge', 'Using gauge')}: ${s ? fmt(s) + ' sts' : '—'} × ${r ? fmt(r) + ' rows' : '—'} / 10 cm</p>` + out;
    }
  } else if (!pS || !mS) {
    out = `<p class="mut">${t('Nhập gauge pattern và gauge swatch của bạn (sts / 10 cm).', 'Enter the pattern gauge and your swatch gauge (sts / 10 cm).')}</p>`;
  } else {
    const f = mS / pS, diff = (mS - pS) / pS * 100, ad = Math.abs(diff);
    let msg;
    if (ad < 2) msg = `<div class="alert soft ok">✓ ${t(`Gauge khớp (lệch ${fmt(ad)}%) — giữ nguyên số mũi pattern.`, `Gauge matches (off by ${fmt(ad)}%) — keep the pattern stitch counts.`)}</div>`;
    else {
      msg = `<div class="alert ${ad > 12 ? 'red' : 'amber'}">${diff > 0
        ? t(`Bạn đan <b>chặt hơn ${fmt(ad)}%</b> → cần <b>nhiều mũi hơn</b> (×${fmt(f, 3)}), hoặc đổi que <b>to hơn +0.5 mm</b>.`, `You knit <b>${fmt(ad)}% tighter</b> → you need <b>more stitches</b> (×${fmt(f, 3)}), or go <b>up 0.5 mm</b> in needle size.`)
        : t(`Bạn đan <b>lỏng hơn ${fmt(ad)}%</b> → cần <b>ít mũi hơn</b> (×${fmt(f, 3)}), hoặc đổi que <b>nhỏ hơn −0.5 mm</b>.`, `You knit <b>${fmt(ad)}% looser</b> → you need <b>fewer stitches</b> (×${fmt(f, 3)}), or go <b>down 0.5 mm</b> in needle size.`)}
        ${ad > 12 ? `<br>⚠️ ${t('Lệch nhiều — nên đổi len hoặc que thay vì chỉ tính lại số mũi.', 'Big difference — consider changing yarn or needles rather than just recalculating.')}` : ''}</div>`;
    }
    let sizes = listNums(g.sizes); if (!sizes.length) sizes = [100];
    out += `<div style="font-size:20px;margin:4px 0 8px"><b>×${fmt(f, 3)}</b> <span class="small mut">(${fmt(mS)} ÷ ${fmt(pS)})</span></div>${msg}
      <h3 style="margin-top:12px">Stitches</h3><div class="scrollx"><table class="tbl"><tr><th>Pattern</th><th class="num">${t('Rộng', 'Width')}</th><th class="num">${t('Bạn cần Cast-On', 'You Cast-On')}</th><th class="num">${t('Rộng nếu giữ số mũi', 'Width if unchanged')}</th></tr>
      ${sizes.map(s => `<tr><td>${fmt(s)} sts</td><td class="num">${fmt(s / pS * 10)} cm</td><td class="num b">${roundMult(s * f, g.mult, g.edge)} sts</td><td class="num">${fmt(s / mS * 10)} cm</td></tr>`).join('')}</table></div>`;
    if (pR && mR) {
      const fr = mR / pR;
      const rows = listNums(g.rows);
      out += `<h3 style="margin-top:12px">Rows <span class="small mut">×${fmt(fr, 3)}</span></h3>${rows.length ? `<div class="scrollx"><table class="tbl"><tr><th>Pattern</th><th class="num">${t('Dài', 'Length')}</th><th class="num">${t('Bạn cần', 'You need')}</th><th class="num">${t('Dài nếu giữ số rows', 'Length if unchanged')}</th></tr>
        ${rows.map(r => `<tr><td>${fmt(r)} rows</td><td class="num">${fmt(r / pR * 10)} cm</td><td class="num b">${Math.round(r * fr)} rows</td><td class="num">${fmt(r / mR * 10)} cm</td></tr>`).join('')}</table></div>` : `<p class="small mut">${t('Nhập số rows của pattern để quy đổi.', 'Enter pattern row counts to convert.')}</p>`}`;
    }
  }
  return out;
}

function rowForm(p, i) {
  const isNew = i == null;
  const last = p.rows[p.rows.length - 1];
  const maxTo = p.rows.reduce((m, r) => Math.max(m, r.to), 0);
  const d = isNew ? { from: maxTo + 1, to: '', sec: last ? last.sec : '', sts: '', rtype: '', f: '', t: '' } : Object.assign({}, p.rows[i]);
  if (!isNew && d.to === d.from) d.to = '';
  const fOpts = [{ k: '', l: '—' }].concat(p.formulas.map(f => ({ k: f.id, l: `${t('Công thức', 'Stitch pattern')} ${f.name} (${formulaLines(f).length} ${t('dòng', 'lines')})` })));
  const ref = rowRef(p), my = myGauge(p), si = ref ? Math.min(p.ref.si || 0, Math.max(0, refSizes(ref).length - 1)) : 0;
  const msList = ref ? ref.ms.filter(m => m.sts.length || m.cm.length) : [];
  const cOpts = [{ k: '', l: '—' }].concat((p.charts || []).map(c => ({ k: c.id, l: `${c.name} (${c.w}×${c.h})` })));
  const n0 = isNew ? '' : (d.to === '' ? 1 : d.to - d.from + 1);
  const ov = modal(`${mHead('📝 ' + (isNew ? t('Ghi chú row', 'Row note') : t('Sửa ghi chú row', 'Edit row note')))}
    <form novalidate>
      <div class="f3">${fld(t('Từ row', 'From row') + ' *', inp('from', d.from, 'type="number" inputmode="numeric" min="1" autofocus'))}${fld(t('Đến row', 'To row'), inp('to', d.to, 'type="number" inputmode="numeric" min="1"'))}${fld(t('Số row', 'Rows'), inp('n', n0, 'type="number" inputmode="numeric" min="1" placeholder="1"'))}</div>
      <p class="small mut" style="margin:-4px 0 8px">${t('Nhập Từ–Đến → tự tính số row · nhập Số row → tự điền Đến (VD từ 1, số 3 → 1–3).', 'Enter From–To → row count fills in · enter Rows → To fills in (e.g. from 1, 3 rows → 1–3).')}</p>
      <div class="f2">${fld(t('Phần', 'Section'), sel('sec', [{ k: '', l: '—' }].concat(SECTIONS), d.sec))}${fld(t('Số mũi sau row', 'Stitch count after'), inp('sts', d.sts, 'type="number" inputmode="numeric" min="0" placeholder="sts"'))}</div>
      ${ref ? `${fld(`📏 ${t('Mốc của mẫu', 'Milestone')} · ${esc(ref.name)} (${esc(refSizes(ref)[si] || '')})`, `<select class="inp" name="ms"><option value="">—</option>${msList.map(m => `<option value="${m.id}" ${m.id === d.ms ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select>`)}<div class="out small" id="rSug" style="display:none;margin:-4px 0 10px"></div>` : ''}
      <div class="f2">${fld(t('Loại row', 'Row type'), sel('rtype', RTYPES, d.rtype))}${fld(t('Lặp công thức', 'Repeat formula'), sel('f', fOpts, d.f))}</div>
      ${(p.charts || []).length ? fld('🎨 ' + t('Đan theo chart', 'Follow chart'), sel('ch', cOpts, d.ch)) : ''}
      ${fld(t('Ghi chú', 'Note'), `<textarea class="inp" name="t" rows="4" placeholder="${t('VD: K2, *P2, K2; rep from * — hoặc mô tả bằng lời', 'e.g. K2, *P2, K2; rep from * — or describe in words')}">${esc(d.t)}</textarea>`)}
      ${p.formulas.length ? '' : `<p class="small mut">${t('Chưa có công thức lặp — tạo ở mục "Công thức lặp" của dự án.', 'No repeat formulas yet — create one under "Repeat formulas".')}</p>`}
      <label class="chk"><input type="checkbox" name="auto" ${p.autoCount !== false ? 'checked' : ''}> ${t('Tự cập nhật số hàng đã đan theo ghi chú (lấy row lớn nhất)', 'Update rows knitted from notes (largest noted row)')}</label>
      <div class="errm" id="rErr"></div>
      <div class="acts"><button class="btn" type="button" data-a="close">${t('Huỷ', 'Cancel')}</button><button class="btn p" type="submit">${t('Lưu', 'Save')}</button></div>
    </form>`);
  const F = ov.querySelector('form'), fF = F.elements.from, fT = F.elements.to, fN = F.elements.n;
  fF.addEventListener('input', () => { const a = parseInt(fF.value), n = parseInt(fN.value), b = parseInt(fT.value); if (a >= 1 && n >= 1) fT.value = a + n - 1; else if (a >= 1 && b >= a) fN.value = b - a + 1; });
  fT.addEventListener('input', () => { const a = parseInt(fF.value), b = parseInt(fT.value); fN.value = a >= 1 && b >= a ? b - a + 1 : ''; });
  fN.addEventListener('input', () => { const a = parseInt(fF.value), n = parseInt(fN.value); if (a >= 1 && n >= 1) fT.value = a + n - 1; });
  const msSel = F.elements.ms;
  const showSug = () => {
    const box = ov.querySelector('#rSug'); if (!box) return;
    const m = ref.ms.find(x => x.id === msSel.value); if (!m) { box.style.display = 'none'; return; }
    const o = msSugg(ref, m, si, my);
    box.innerHTML = suggText(o) + (o.sts != null ? ` <button class="btn sm" type="button" id="rUse">${t('Dùng', 'Use')} ${o.sts} sts</button>` : (my.s ? '' : `<div class="mut">${t('Nhập gauge của bạn để có số quy đổi.', 'Enter your gauge to get converted counts.')}</div>`)) + (m.note ? `<div class="mut">${esc(m.note)}</div>` : '');
    box.style.display = '';
    const u = box.querySelector('#rUse'); if (u) u.onclick = () => { F.elements.sts.value = o.sts; toast(t('Đã điền số mũi gợi ý — sửa tuỳ ý', 'Suggested count filled — adjust freely')); };
  };
  if (msSel) { msSel.onchange = showSug; showSug(); }
  F.onsubmit = e => {
    e.preventDefault();
    const f = formData(e.target);
    const from = parseInt(f.from), nn = parseInt(f.n);
    const to = f.to !== '' ? parseInt(f.to) : nn >= 1 ? from + nn - 1 : from;
    const err = m => { ov.querySelector('#rErr').textContent = m; };
    if (!(from >= 1)) return err(t('"Từ row" phải ≥ 1.', '"From row" must be ≥ 1.'));
    if (!(to >= from)) return err(t('"Đến row" phải ≥ "Từ row".', '"To row" must be ≥ "From row".'));
    if (!f.t && !f.f && !f.ch && !f.ms) return err(t('Cần có ghi chú, công thức, chart hoặc mốc.', 'Add a note, a formula, a chart or a milestone.'));
    const r = normRow({ from, to, sec: f.sec, sts: f.sts, rtype: f.rtype, f: f.f, t: f.t, ch: f.ch || '', ms: f.ms || '', done: isNew ? false : p.rows[i].done });
    if (isNew) p.rows.push(r); else p.rows[i] = r;
    sortRows(p);

    let bumped = 0;
    if (p.autoCount) { /* có khoảng hở vẫn lấy row lớn nhất đã ghi; bộ đếm lớn hơn thì giữ nguyên */
      const mx = p.rows.reduce((m, x) => Math.max(m, x.to), 0);

    }
    touch(p); save(); ov._close(); render();
    toast(bumped ? t(`Đã lưu ✓ · Số hàng đã đan → ${bumped} (↩ ở bộ đếm để hoàn tác)`, `Saved ✓ · Rows knitted → ${bumped} (↩ on the counter to undo)`) : t('Đã lưu ghi chú ✓', 'Note saved ✓'));
  };
}

async function shareOrDownload(blob, filename, title) {
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: title || filename });
      return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; console.warn(e); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
  }
}

/* =====================================================================

function patDefaults(p) {
  const sz = p.size && p.size !== '' ? lbl(SIZES, p.size) : '';
  return {
    title: String(p.name || '').replace(/\s*\((ví dụ|example)\)\s*/ig, ' ').trim(),
    designer: db && db.settings ? db.settings.name : '',
    diff: 'easy', ptype: p.sharedFrom ? 'notes' : (p.patternName && !p.design ? 'notes' : 'personal'), lang: L,
    origName: p.patternName || '', origUrl: p.patternUrl || '', intro: '',
    sizes: sz, gSts: p.myGaugeSts || p.pGaugeSts || '', gRows: p.myGaugeRows || p.pGaugeRows || '', gStitch: 'Stockinette',
    measure: '', notions: '', sections: [], inclFormulas: true, abbrOff: [], abbrCustom: '', notes: p.notes || '', inclPhotos: true,
    tool: { w: '', mult: '', edge: '' }
  };
}
function ensurePat(p) {
  if (!p.pat) p.pat = patDefaults(p);
  p.pat = Object.assign(patDefaults(p), p.pat);
  if (!Array.isArray(p.pat.sections)) p.pat.sections = [];
  if (!Array.isArray(p.pat.abbrOff)) p.pat.abbrOff = [];
  if (!p.pat.tool) p.pat.tool = { w: '', mult: '', edge: '' };
  return p.pat;
}
const tpf = lang => (vi, en) => (lang === 'vi' ? vi : en);
function patText(p) {
  const a = p.pat;
  return [a.intro, a.notions, a.notes, a.measure].concat(a.sections.map(s => s.title + '\n' + s.body)).concat(a.inclFormulas ? p.formulas.map(f => f.text) : []).join('\n');
}
function detectAbbr(text) { const s = stripVN(text); return ABBR.filter(x => x.re.test(s)); }
function customAbbr(a) { return String(a.abbrCustom || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf('='); return i > 0 ? { k: l.slice(0, i).trim(), v: l.slice(i + 1).trim() } : { k: l, v: '' }; }); }
function materials(p, lang) {
  return materialsBase(p, lang).concat(String(p.pat.notions || '').split('\n').map(s => s.trim()).filter(Boolean));
}
function materialsBase(p, lang) {
  const tp = tpf(lang);
  const y = yarnOf(p) || p.yarnInfo;
  const out = [];
  if (y) {
    const bits = [y.weight ? wName(y.weight) : '', y.fiber ? lbl(FIBERS, y.fiber, lang) : '', y.gramsPerSkein ? `${y.gramsPerSkein} g${y.metersPerSkein ? ' / ' + y.metersPerSkein + ' m' : ''}` : ''].filter(Boolean).join(', ');
    let line = `${tp('Len', 'Yarn')}: ${yarnTitle(y)}${bits ? ' (' + bits + ')' : ''}`;
    const gu = num(p.gramsUsed), gp = num(y.gramsPerSkein), mp = num(y.metersPerSkein);
    if (gu) {
      line += ` — ~${gu} g`;
      if (gp) line += ` ≈ ${Math.ceil(gu / gp)} ${tp('cuộn', 'skeins')}`;
      if (gp && mp) line += ` (~${Math.round(gu / gp * mp)} m)`;
    }
    out.push(line);
  } else if (num(p.gramsUsed)) out.push(`${tp('Len', 'Yarn')}: ~${p.gramsUsed} g`);
  if (p.needle) out.push(`${p.craft === 'crochet' ? tp('Kim móc', 'Crochet hook') : tp('Que đan', 'Needles')}: ${p.needle} mm`);
  return out;
}
function sizeTool(p) {
  const a = p.pat, g = num(a.gSts);
  const ws = listNums(a.tool.w);
  if (!g || !ws.length) return '';
  const n = ws.map(w => roundMult(w / 10 * g, a.tool.mult, a.tool.edge));
  return `CO ${n[0]}${n.length > 1 ? ' (' + n.slice(1).join(', ') + ')' : ''} sts`;
}
/* ---- Tạo nháp từ ghi chú row ---- */
function formulaSentence(f, n, lang) {
  const tp = tpf(lang);
  const k = formulaLines(f).length; if (!k) return '';
  const full = Math.floor(n / k), rem = n % k;
  const nm = 'Stitch pattern ' + f.name;
  const rr = rem === 1 ? 'row 1' : 'rows 1–' + rem;
  const times = x => lang === 'vi' ? `${x} lần` : (x === 1 ? 'once' : `${x} times`);
  if (full >= 1 && rem > 0) return tp(`Đan ${nm} ${times(full)}, rồi đan thêm ${rr} của ${nm} (${n} rows)`, `Work ${nm} ${times(full)}, then ${rr} once more (${n} rows)`);
  if (full >= 1) return tp(`Đan ${nm} ${times(full)} (${n} rows)`, `Work ${nm} ${times(full)} (${n} rows)`);
  return tp(`Đan ${rr} của ${nm} (${n} rows)`, `Work ${rr} of ${nm} (${n} rows)`);
}
function genDraft(p, lang) {
  const groups = [], map = {};
  p.rows.forEach(r => { const k = r.sec || 'other'; if (!map[k]) { map[k] = { k, rows: [] }; groups.push(map[k]); } map[k].rows.push(r); });
  const secs = groups.map(g => {
    let round = false;
    const lines = g.rows.map(r => {
      if (r.rtype === 'round') round = true;
      const multi = r.to > r.from;
      const word = round ? (multi ? 'Rnds' : 'Rnd') : (multi ? 'Rows' : 'Row');
      let head = `${word} ${r.from}${multi ? '–' + r.to : ''}`;
      if (r.rtype === 'rs') head += ' (RS)'; else if (r.rtype === 'ws') head += ' (WS)';
      if (RTAG[r.rtype]) head += ` [${lb(RTAG[r.rtype], lang)}]`;
      const parts = [];
      const f = fOf(p, r.f);
      if (f) { let s = formulaSentence(f, r.to - r.from + 1, lang); if (round) s = s.replace(/\brows\b/g, 'rnds').replace(/\brow 1\b/g, 'rnd 1'); if (s) parts.push(s); }
      const note = String(r.t || '').split('\n').map(s => s.trim()).filter(Boolean).join(' ').replace(/[.。]\s*$/, '');
      if (note) parts.push(note);
      let line = head + ': ' + parts.join('. ') + (parts.length ? '.' : '');
      if (r.sts && !new RegExp('\\b' + r.sts + '\\s*sts\\b').test(note)) line += ` (${r.sts} sts)`;
      return line;
    });
    return { id: uid(), title: lbl(SECTIONS, g.k, lang), body: lines.join('\n') };
  });
  if (!map.finishing) secs.push({ id: uid(), title: lbl(SECTIONS, 'finishing', lang), body: lang === 'vi' ? 'Giấu đầu sợi. Blocking theo kích thước thành phẩm.' : 'Weave in all ends. Block to measurements.' });
  return secs;
}

}

  yPhotoMain: el => { const y = Y(el.dataset.id), i = +el.dataset.i; const [im] = y.photos.splice(i, 1); y.photos.unshift(im); save(); renderView(); },
  yDomHex: async el => {
    const y = Y(el.dataset.id); if (!y.photos[0]) return;
    try { const h = await dominantHex(y.photos[0]); y.domHex = h; y.hex = h; save(); renderView(); toast(t('Đã lấy màu từ ảnh ✓ ', 'Color taken from photo ✓ ') + h); } catch (e) { toast(t('Không đọc được ảnh', 'Could not read image')); }
  }
});
Object.assign(C, {
  refF: el => {
    const r = RF(state.route.id); if (!r) return; const f = el.dataset.f;
    r[f] = ['gSts', 'gRows'].includes(f) ? num(el.value) : el.value.trim(); r.updated = Date.now(); save();
    if (['cons', 'sizes', 'gSts', 'name'].includes(f)) softRender();
  },
  refMs: el => {
    const r = RF(state.route.id), m = r.ms[+el.dataset.mi], f = el.dataset.f; if (!m) return;
    m[f] = f === 'sts' || f === 'cm' ? parseSeq(el.value) : f === 'fixed' ? num(el.value) : el.value.trim();
    r.updated = Date.now(); save(); if (f !== 'note' && f !== 'label') softRender();
  },
  refMeas: el => { const r = RF(state.route.id), m = r.meas[+el.dataset.mi]; if (!m) return; m[el.dataset.f] = el.dataset.f === 'v' ? parseSeq(el.value) : el.value.trim(); r.updated = Date.now(); save(); if (el.dataset.f === 'v') softRender(); },
  refImg: async el => {
    const r = RF(state.route.id); const room = 4 - r.diagram.length;
    const imgs = await readImages(Array.from(el.files).slice(0, room), 1400); el.value = '';
    if (!imgs.length) { toast(t('Không đọc được ảnh', 'Could not read image')); return; }
    r.diagram = r.diagram.concat(imgs).slice(0, 4); r.updated = Date.now(); save(); renderView();
  },
  pRef: el => { const p = curP(el); p.ref = el.value ? { id: el.value, si: 0 } : null; touch(p); save(); softRender(); },
  pRefSize: el => { const p = curP(el); p.ref.si = +el.value; touch(p); save(); softRender(); },
  chF: el => {
    const ed = CH.ed, c = ed.c, f = el.dataset.f;
    c[f] = f === 'flat' ? el.value === '1' : f === 'start' ? Math.max(1, parseInt(el.value) || 1) : el.value; c.updated = Date.now(); touch(ed.p); save();
    if (f !== 'notes' && f !== 'rowNotes' && f !== 'name') softRender();
  },
  chChk: el => { const ed = CH.ed; if (el.dataset.f === 'showSym') ed.showSym = el.checked; else { ed.c.sq = el.checked; ed.c.updated = Date.now(); save(); } chartRedraw(); },
  chSize: async el => {
    const ed = CH.ed, c = ed.c; const v = Math.min(CH_MAX, Math.max(1, parseInt(el.value) || 1));
    const nw = el.dataset.f === 'w' ? v : c.w, nh = el.dataset.f === 'h' ? v : c.h;
    if (nw < c.w || nh < c.h) { const ok = await ask({ ic: '✂️', title: t('Thu nhỏ chart?', 'Shrink chart?'), desc: t('Phần ô nằm ngoài (bên trái / phía trên) sẽ bị cắt bỏ.', 'Cells outside (left / top) will be cut off.'), ok: t('Thu nhỏ', 'Shrink') }); if (!ok) { renderView(); return; } }
    chartResize(c, ed, nw, nh); softRender();
  },
  yPhoto: async el => {
    const y = Y(el.dataset.id); const room = 4 - y.photos.length;
    const imgs = await readImages(Array.from(el.files).slice(0, room), 1200); el.value = '';
    if (!imgs.length) { toast(t('Không đọc được ảnh', 'Could not read image')); return; }
    const first = !y.photos.length;
    y.photos = y.photos.concat(imgs).slice(0, 4);
    if (first) { try { y.domHex = await dominantHex(y.photos[0]); } catch (e) {} }
    save(); renderView(); toast(t(`Đã thêm ${imgs.length} ảnh ✓`, `${imgs.length} photo(s) added ✓`));
  }
});

/* Vẽ lại sau sự kiện change (tránh vẽ lại giữa lúc blur) và giữ ô đang nhập */
function softRender() {
  setTimeout(() => {
    const a = document.activeElement, ds = a && a.dataset ? a.dataset : {};
    const sel = ['c', 'f', 'mi', 'id'].filter(k => ds[k] != null).map(k => `[data-${k}="${String(ds[k]).replace(/["\\]/g, '')}"]`).join('');
    const sy = window.scrollY; renderView(); window.scrollTo(0, sy);
    if (sel && (ds.c || ds.i)) { const n = $(sel); if (n && n.focus) n.focus({ preventScroll: true }); }
  }, 0);
}
/* mẫu tham chiếu ví dụ (số liệu tự dựng, không lấy từ pattern có bản quyền) */
function exampleRef() {
  const vi = L === 'vi';
  const r = normRef({ example: true, name: vi ? 'Áo len raglan cổ tròn (mẫu ví dụ)' : 'Round-neck raglan sweater (example)', source: 'YarnLoop', garment: 'pullover', cons: 'raglan', sizes: 'S, M, L', gSts: 20, gRows: 28, yarn: 'DK merino', weight: 'dk', needles: vi ? '3.5 mm bo, 4 mm thân' : '3.5 mm rib, 4 mm body', notes: vi ? 'Số liệu tự dựng để thử tính năng.' : 'Made-up figures for trying the feature.' });
  const S = (k, sts, cm, note) => { const m = msPreset('raglan').find(x => x.k === k); m.sts = sts; m.cm = cm; m.note = note || ''; return m; };
  r.ms = [S('co', [88, 96, 104], [], vi ? 'Bo gân 2x2 cổ 3 cm' : '2x2 rib neck 3 cm'), S('raglanEnd', [296, 320, 348], [20, 21, 23], vi ? 'Tăng 8 mũi mỗi 2 hàng' : 'Inc 8 sts every 2nd row'),
    S('split', [296, 320, 348], [20, 21, 23]), S('body', [184, 200, 216], [], vi ? 'Gồm 8-8-10 mũi nách mỗi bên' : 'Incl. 8-8-10 underarm sts each side'),
    S('waist', [176, 192, 208], [15, 15, 16]), S('hem', [184, 200, 216], [6, 6, 6], vi ? 'Bo gân 2x2' : '2x2 rib'), S('length', [], [36, 37, 38], vi ? 'Tính từ nách' : 'From underarm'),
    S('sleeveTop', [72, 76, 86], []), S('sleeveDec', [48, 52, 56], [38, 39, 40]), S('cuff', [48, 52, 56], [6, 6, 6]), S('sleeveLen', [], [44, 45, 46])];
  r.meas = [{ id: uid(), label: vi ? 'Vòng ngực' : 'Chest', v: [92, 100, 108] }, { id: uid(), label: vi ? 'Dài áo' : 'Length', v: [56, 58, 61] }];
  return r;
}


function setLang(l) {
  if (l !== 'vi' && l !== 'en') return;
  const wn = $('#wName'); if (wn) db.settings.name = wn.value.trim();
  L = l; db.settings.lang = l; save();
  const settingsOpen = !!$('#setName');
  closeAll(); shell(); render();
  if (settingsOpen) openSettings();
}

/* =====================================================================
   INIT
   ===================================================================== */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); state.deferredPrompt = e; updateInstallBtn(); });
window.addEventListener('appinstalled', () => { state.deferredPrompt = null; updateInstallBtn(); toast(t('Đã cài YarnLoop 🎉', 'YarnLoop installed 🎉')); });
(async function init() {
  const nj = document.getElementById('nojs'); if (nj) nj.remove();
  const st = document.createElement('style'); st.textContent = patCss(); document.head.appendChild(st);
  await storeInit();
  db = normalize(await storeLoad());
  if (db.settings.lang) L = db.settings.lang;
  state.g = { mode: 1, pS: '', pR: '', mS: '', mR: '', sizes: '', rows: '', mult: '', edge: '', widths: '', lengths: '' };
  state.route = parseHash();
  shell(); render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  }
})();
